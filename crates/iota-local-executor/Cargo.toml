[package]
name = "iota-local-executor"
version.workspace = true
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Local Move VM executor for dry-run/dev-inspect without a node"

[dependencies]
# external dependencies
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bcs.workspace = true
prometheus.workspace = true
tokio.workspace = true
tracing.workspace = true

# internal dependencies
iota-config.workspace = true
# `tracing` wires up the Move VM's gas profiler and instruction-level trace
# builder; `debug-print` enables `debug::print` output. This crate's whole
# purpose is local debugging, so both are enabled unconditionally.
iota-execution = { workspace = true, features = ["tracing", "debug-print"] }
iota-framework.workspace = true
iota-graphql-rpc-client.workspace = true
iota-graphql-rpc-headers.workspace = true
iota-grpc-client.workspace = true
iota-grpc-types.workspace = true
iota-json-rpc-api.workspace = true
iota-json-rpc-types.workspace = true
iota-move-build.workspace = true
iota-protocol-config.workspace = true
iota-sdk.workspace = true
iota-sdk-types.workspace = true
iota-transaction-checks.workspace = true
iota-types.workspace = true
move-binary-format.workspace = true
move-core-types.workspace = true
move-stdlib-natives = { workspace = true, features = ["testing"] }
move-trace-format.workspace = true
serde_json.workspace = true

[dev-dependencies]
iota-keys.workspace = true
iota-macros.workspace = true
iota-test-transaction-builder.workspace = true
test-cluster.workspace = true

[[example]]
name = "local_dev_inspect"
path = "examples/local_dev_inspect.rs"

[[example]]
name = "local_stake_inspect"
path = "examples/local_stake_inspect.rs"

[[example]]
name = "offline_dev_inspect"
path = "examples/offline_dev_inspect.rs"

[[example]]
name = "offline_stake_inspect"
path = "examples/offline_stake_inspect.rs"

[[example]]
name = "hardcoded_offline_inspect"
path = "examples/hardcoded_offline_inspect.rs"

[[example]]
name = "local_package_debug"
path = "examples/local_package_debug.rs"
