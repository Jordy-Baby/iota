<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iota-vm-sdk wasm example</title>
    <style>
      :root {
        --bg: #161b24;
        --panel: #1f2630;
        --border: #3a424d;
        --text: #eef2f7;
        --muted: #9ba6b3;
        --accent: #2dd4bf;
        --ok: #3fb950;
        --bad: #f85149;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        max-width: 60rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin-top: 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin: 1.75rem 0;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.55rem 1rem;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      button:hover {
        border-color: var(--accent);
        background: #1c232c;
      }
      button:active {
        transform: translateY(1px);
      }
      #status {
        font-size: 0.95rem;
        font-weight: 600;
        min-height: 1.4rem;
        margin: 0 0 0.6rem;
        color: var(--muted);
      }
      #status:empty::before {
        display: none;
      }
      #status::before {
        content: "";
        display: inline-block;
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        margin-right: 0.5rem;
        background: currentColor;
        vertical-align: middle;
      }
      pre {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 1rem 1.1rem;
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.85rem;
        color: var(--muted);
      }
      #status.ok {
        color: var(--ok);
      }
      #status.bad {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <h1>iota-vm-sdk in the browser</h1>
    <p>
      Runs an example transaction through the local Move VM compiled to wasm and
      shows the result. Each example reuses a committed test fixture (a
      transaction plus the objects it touches).
    </p>

    <div class="actions">
      <button id="valid">Valid: free-access authenticator</button>
      <button id="invalid">Invalid: bad ed25519 signature</button>
      <button id="stake">Staking: emits events</button>
    </div>

    <p id="status"></p>
    <pre id="output">Loading wasm…</pre>

    <script type="module">
      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");

      // Fixtures live in the crate's test suite; serve the crate root so this
      // relative path resolves (see README.md).
      const FIXTURES = {
        valid: "../../tests/fixtures/move_auth_free_access_valid.json",
        invalid: "../../tests/fixtures/move_auth_ed25519_invalid.json",
        stake: "../../tests/fixtures/stake.json",
      };

      // Bound once the wasm module loads in the bootstrap below.
      let simulate;

      async function run(which) {
        statusEl.textContent = "";
        outputEl.textContent = "Running…";
        try {
          const fixture = await (await fetch(FIXTURES[which])).json();
          // The fixture already carries every SimulateRequest field; run in
          // dev-inspect (relaxed checks) since the fixtures carry no real gas.
          const result = simulate({ ...fixture, strict: false });
          const verdict = result.success ? "succeeded" : "failed";
          statusEl.textContent = `Execution ${verdict}` +
            (fixture.signatures?.length
              ? ` · signature ${result.signature_verified ? "verified" : "rejected"}`
              : "");
          statusEl.className = result.success ? "ok" : "bad";
          outputEl.textContent = JSON.stringify(result, null, 2);
        } catch (e) {
          statusEl.textContent = "Error";
          statusEl.className = "bad";
          outputEl.textContent = String(e);
        }
      }

      // Load the wasm via dynamic import so a missing build (404 on the js or
      // wasm) is reported in the page. A static import would fail the whole
      // module before any code runs, leaving "Loading wasm…" with only a
      // console error.
      try {
        const wasm = await import("./pkg/iota_vm_sdk.js");
        simulate = wasm.simulate;
        await wasm.default();
        outputEl.textContent = "Ready. Pick an example above.";
        document.getElementById("valid").addEventListener("click", () => run("valid"));
        document.getElementById("invalid").addEventListener("click", () => run("invalid"));
        document.getElementById("stake").addEventListener("click", () => run("stake"));
      } catch (e) {
        statusEl.textContent = "Failed to load wasm";
        statusEl.className = "bad";
        outputEl.textContent = String(e) +
          "\n\nDid you build the wasm package? See README.md.";
      }
    </script>
  </body>
</html>
