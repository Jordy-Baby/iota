<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iota-vm-sdk wasm example</title>
    <style>
      :root {
        --bg: #0c1018;
        --panel: rgba(31, 38, 48, 0.55);
        --border: rgba(120, 135, 155, 0.18);
        --text: #eef2f7;
        --muted: #98a4b3;
        --accent: #2dd4bf;
        --ok: #3fb950;
        --bad: #f85149;
        --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset,
          0 10px 30px -12px rgba(0, 0, 0, 0.6);
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        max-width: 56rem;
        margin: 0 auto;
        padding: clamp(2.5rem, 8vw, 5rem) 1.25rem 4rem;
        color: var(--text);
        line-height: 1.6;
        background-color: #090c12;
        background-image: radial-gradient(
            55% 45% at 50% -8%,
            rgba(45, 212, 191, 0.13),
            transparent 62%
          ),
          radial-gradient(
            45% 55% at 0% 28%,
            rgba(99, 102, 241, 0.1),
            transparent 58%
          ),
          radial-gradient(
            50% 55% at 100% 72%,
            rgba(45, 212, 191, 0.07),
            transparent 58%
          );
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
      }
      .eyebrow {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 0.75rem;
      }
      h1 {
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        line-height: 1.1;
        margin: 0 0 0.6rem;
        letter-spacing: -0.02em;
        background: linear-gradient(180deg, #ffffff, #b9c4d2);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p.lead {
        color: var(--muted);
        margin: 0;
        max-width: 44rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin: 2.25rem 0 1.5rem;
      }
      button {
        position: relative;
        font: inherit;
        font-weight: 500;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.6rem 1.1rem;
        cursor: pointer;
        backdrop-filter: blur(8px);
        box-shadow: var(--shadow);
        transition: transform 0.12s ease, border-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      button::before {
        content: "";
        position: absolute;
        left: 0.95rem;
        top: 50%;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--dot, var(--accent));
        box-shadow: 0 0 8px var(--dot, var(--accent));
        transform: translateY(-50%);
      }
      button {
        padding-left: 1.9rem;
      }
      button.valid {
        --dot: var(--ok);
      }
      button.invalid {
        --dot: var(--bad);
      }
      button.stake {
        --dot: var(--accent);
      }
      button:hover {
        border-color: color-mix(in srgb, var(--dot, var(--accent)) 60%, transparent);
        box-shadow: var(--shadow),
          0 0 0 1px color-mix(in srgb, var(--dot, var(--accent)) 25%, transparent),
          0 8px 24px -10px color-mix(in srgb, var(--dot, var(--accent)) 70%, transparent);
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: linear-gradient(
          180deg,
          rgba(31, 38, 48, 0.6),
          rgba(20, 25, 33, 0.6)
        );
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-size: 0.9rem;
        font-weight: 600;
        margin: 0;
        padding: 0.85rem 1.2rem;
        color: var(--muted);
        border-bottom: 1px solid transparent;
      }
      #status:not(:empty) {
        border-bottom-color: var(--border);
      }
      #status::before {
        content: "";
        display: inline-block;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 10px currentColor;
        flex: none;
      }
      #status:empty {
        display: none;
      }
      #status.ok {
        color: var(--ok);
      }
      #status.bad {
        color: var(--bad);
      }
      .cap {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0.7rem 1.2rem;
        border-bottom: 1px solid var(--border);
      }
      .panel + .panel {
        margin-top: 1rem;
      }
      #tx-desc {
        margin: 0;
        padding: 0.85rem 1.25rem;
        font-size: 0.85rem;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }
      #tx-desc:empty {
        display: none;
      }
      #tx,
      #output {
        margin: 0;
        padding: 1.1rem 1.25rem;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.82rem;
        line-height: 1.6;
        color: #c7d0db;
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      }
      /* Collapsible JSON tree (built in jsonNode below; native <details>). */
      .jrow {
        padding-left: 1.15em;
      }
      details.jnode > summary {
        list-style: none;
        cursor: pointer;
      }
      details.jnode > summary::-webkit-details-marker {
        display: none;
      }
      details.jnode > summary::before {
        content: "▸";
        display: inline-block;
        width: 1.15em;
        color: var(--muted);
        transition: transform 0.12s ease;
      }
      details.jnode[open] > summary::before {
        transform: rotate(90deg);
      }
      details.jnode > .jkids {
        padding-left: 1.15em;
      }
      details.jnode[open] > summary > .jcount,
      details.jnode[open] > summary > .jclosed {
        display: none;
      }
      .jbrace {
        padding-left: 1.15em;
      }
      summary:hover .jkey {
        color: #aee4ff;
      }
      .jkey {
        color: #7dcfff;
      }
      .jstr {
        color: #9ece6a;
      }
      .jnum {
        color: #ff9e64;
      }
      .jbool,
      .jnull {
        color: #bb9af7;
      }
      .jpunct,
      .jcount {
        color: var(--muted);
      }
      .jcount {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Move VM · WebAssembly</p>
    <h1>iota-vm-sdk in the browser</h1>
    <p class="lead">
      Runs an example transaction through the local Move VM compiled to wasm and
      shows the result. Each example reuses a committed test fixture (a
      transaction plus the objects it touches).
    </p>

    <div class="actions">
      <button id="valid" class="valid">Valid: free-access authenticator</button>
      <button id="invalid" class="invalid">Invalid: bad ed25519 signature</button>
      <button id="stake" class="stake">Staking: emits events</button>
    </div>

    <div class="panel" id="tx-panel" hidden>
      <div class="cap">Transaction</div>
      <p id="tx-desc"></p>
      <div id="tx"></div>
    </div>

    <div class="panel">
      <div class="cap">Result</div>
      <p id="status"></p>
      <div id="output">Loading wasm…</div>
    </div>

    <script type="module">
      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");
      const txPanel = document.getElementById("tx-panel");
      const txDescEl = document.getElementById("tx-desc");
      const txEl = document.getElementById("tx");

      // Fixtures live in the crate's test suite; serve the crate root so this
      // relative path resolves (see README.md).
      const FIXTURES = {
        valid: "../../tests/fixtures/move_auth_free_access_valid.json",
        invalid: "../../tests/fixtures/move_auth_ed25519_invalid.json",
        stake: "../../tests/fixtures/stake.json",
      };

      // Bound once the wasm module loads in the bootstrap below.
      let simulate;
      let decodeTransactionJson;

      async function run(which) {
        statusEl.textContent = "";
        outputEl.textContent = "Running…";
        try {
          const fixture = await (await fetch(FIXTURES[which])).json();
          // Decode and show the transaction being simulated (sender, gas, and
          // the PTB inputs/commands) before running it.
          showTransaction(fixture);
          // The fixture already carries every SimulateRequest field; run in
          // dev-inspect (relaxed checks) since the fixtures carry no real gas.
          const result = simulate({ ...fixture, strict: false });
          const verdict = result.success ? "succeeded" : "failed";
          statusEl.textContent = `Execution ${verdict}` +
            (fixture.signatures?.length
              ? ` · signature ${result.signature_verified ? "verified" : "rejected"}`
              : "");
          statusEl.className = result.success ? "ok" : "bad";
          showResult(result);
        } catch (e) {
          statusEl.textContent = "Error";
          statusEl.className = "bad";
          outputEl.textContent = String(e);
        }
      }

      // Render a result into the output panel as a collapsible JSON tree.
      function showResult(result) {
        outputEl.textContent = "";
        outputEl.append(jsonNode(result, null));
      }

      // Decode the fixture's transaction and render it as a collapsible tree,
      // with the fixture's description as a caption above it. The tree starts
      // collapsed (it's secondary to the result); expanding shows it in full.
      function showTransaction(fixture) {
        txDescEl.textContent = fixture.description ?? "";
        txEl.textContent = "";
        txEl.append(jsonNode(decodeTransactionJson(fixture.tx_b64), null, false));
        txPanel.hidden = false;
      }

      const span = (cls, text) => {
        const el = document.createElement("span");
        el.className = cls;
        el.textContent = text;
        return el;
      };

      // Build a collapsible DOM tree for a JSON value using native <details>.
      // `key` labels this node (object key or array index), or null at the root.
      // `open` controls whether this node starts expanded; nested nodes always
      // start open, so expanding a collapsed root reveals the whole subtree.
      function jsonNode(value, key, open = true) {
        const label = key === null ? null : span("jkey", JSON.stringify(key));
        if (value === null || typeof value !== "object") {
          const cls = value === null ? "jnull"
            : typeof value === "string" ? "jstr"
            : typeof value === "number" ? "jnum" : "jbool";
          const row = document.createElement("div");
          row.className = "jrow";
          if (label) row.append(label, span("jpunct", ": "));
          const text = typeof value === "string" ? JSON.stringify(value) : String(value);
          row.append(span(cls, text));
          return row;
        }

        const arr = Array.isArray(value);
        const entries = arr ? value.map((v, i) => [i, v]) : Object.entries(value);
        const close = arr ? "]" : "}";

        const details = document.createElement("details");
        details.className = "jnode";
        details.open = open;

        const summary = document.createElement("summary");
        if (label) summary.append(label, span("jpunct", ": "));
        summary.append(span("jpunct", arr ? "[" : "{"));
        summary.append(span("jcount", ` ${entries.length} ${arr ? "items" : "keys"} `));
        summary.append(span("jclosed jpunct", close));

        const kids = document.createElement("div");
        kids.className = "jkids";
        for (const [k, v] of entries) kids.append(jsonNode(v, k));

        details.append(summary, kids, span("jbrace jpunct", close));
        return details;
      }

      // Load the wasm via dynamic import so a missing build (404 on the js or
      // wasm) is reported in the page. A static import would fail the whole
      // module before any code runs, leaving "Loading wasm…" with only a
      // console error.
      try {
        const wasm = await import("./pkg/iota_vm_sdk.js");
        simulate = wasm.simulate;
        decodeTransactionJson = wasm.decode_transaction_json;
        await wasm.default();
        outputEl.textContent = "Ready. Pick an example above.";
        document.getElementById("valid").addEventListener("click", () => run("valid"));
        document.getElementById("invalid").addEventListener("click", () => run("invalid"));
        document.getElementById("stake").addEventListener("click", () => run("stake"));
      } catch (e) {
        statusEl.textContent = "Failed to load wasm";
        statusEl.className = "bad";
        outputEl.textContent = String(e) +
          "\n\nDid you build the wasm package? See README.md.";
      }
    </script>
  </body>
</html>
